<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Regex 字串取代工具</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --border: #e0ddd5;
    --border-focus: #888;
    --text: #1a1916;
    --muted: #7a7870;
    --hint: #b0ada5;
    --accent: #1a1916;
    --danger: #c0392b;
    --success: #1a7a4a;
    --mono: 'Courier New', Courier, monospace;
    --sans: 'Georgia', serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181a;
      --surface: #222224;
      --border: #38383c;
      --border-focus: #888;
      --text: #eeecea;
      --muted: #888680;
      --hint: #555350;
      --accent: #eeecea;
      --danger: #e05a4a;
      --success: #4caf82;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 4rem;
  }

  .container {
    width: 100%;
    max-width: 660px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  header {
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-family: var(--mono);
    font-size: 1.05rem;
    font-weight: normal;
    letter-spacing: 0.05em;
    color: var(--text);
  }

  header p {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 4px;
    font-family: var(--mono);
  }

  .field {
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .regex-row {
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .regex-row:focus-within { border-color: var(--border-focus); }

  .regex-slash {
    font-family: var(--mono);
    font-size: 1rem;
    color: var(--hint);
    padding: 0 8px;
    user-select: none;
    line-height: 1;
  }

  .regex-row input {
    flex: 1;
    height: 40px;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--mono);
    font-size: 0.9rem;
    color: var(--text);
    padding: 0 4px;
  }

  .regex-flag {
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--hint);
    padding: 0 10px;
    user-select: none;
  }

  input.plain, textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 10px 12px;
    transition: border-color 0.15s;
    outline: none;
  }
  input.plain { height: 40px; }
  input.plain:focus, textarea:focus { border-color: var(--border-focus); }

  textarea {
    resize: vertical;
    line-height: 1.65;
  }

  textarea.output {
    background: var(--bg);
    color: var(--text);
  }

  .error {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--danger);
    min-height: 18px;
    margin-top: 5px;
  }

  .divider {
    display: flex;
    align-items: center;
    margin: 1rem 0;
    gap: 12px;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .btn-convert {
    width: 100%;
    height: 44px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-convert:hover { opacity: 0.85; }
  .btn-convert:active { transform: scale(0.99); }

  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .output-meta {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--hint);
  }

  .btn-copy {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-copy:hover { background: var(--surface); color: var(--text); }
  .btn-copy.copied { color: var(--success); border-color: var(--success); }

  footer {
    margin-top: 3rem;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--hint);
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>regex_replace.html</h1>
    <p>刪除或取代符合規則的字元</p>
  </header>

  <div class="field">
    <label>Regex Pattern</label>
    <div class="regex-row">
      <span class="regex-slash">/</span>
      <input type="text" id="regexInput" value="[^\S\n]" spellcheck="false" autocomplete="off" />
      <span class="regex-flag">/g</span>
    </div>
    <div class="error" id="regexError"></div>
  </div>

  <div class="field">
    <label>取代為（留空 = 刪除）</label>
    <input type="text" class="plain" id="replaceInput" value="" placeholder="留空即為刪除" spellcheck="false" />
  </div>

  <div class="field">
    <label>輸入文字</label>
    <textarea id="inputText" rows="10" placeholder="在此貼入要處理的文字…"></textarea>
  </div>

  <button class="btn-convert" id="convertBtn">轉換</button>

  <div class="divider"></div>

  <div class="field">
    <div class="output-header">
      <label style="margin:0">輸出結果 <span class="output-meta" id="stats"></span></label>
      <button class="btn-copy" id="copyBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span id="copyLabel">複製</span>
      </button>
    </div>
    <textarea class="output" id="outputText" rows="10" readonly placeholder="結果顯示於此…"></textarea>
  </div>

  <footer>本工具純前端運作，不傳送任何資料</footer>
</div>

<script>
const regexInput  = document.getElementById('regexInput');
const replaceInput= document.getElementById('replaceInput');
const inputText   = document.getElementById('inputText');
const outputText  = document.getElementById('outputText');
const regexError  = document.getElementById('regexError');
const statsEl     = document.getElementById('stats');
const copyBtn     = document.getElementById('copyBtn');
const copyLabel   = document.getElementById('copyLabel');

function getRegex() {
  try {
    const r = new RegExp(regexInput.value, 'g');
    regexError.textContent = '';
    return r;
  } catch(e) {
    regexError.textContent = '⚠ ' + e.message;
    return null;
  }
}

document.getElementById('convertBtn').addEventListener('click', () => {
  const regex = getRegex();
  if (!regex) return;
  const input = inputText.value;
  const replace = replaceInput.value;
  const matches = [...input.matchAll(new RegExp(regexInput.value, 'g'))];
  outputText.value = input.replace(regex, replace);
  statsEl.textContent = matches.length ? `— 共取代 ${matches.length} 處` : '— 無符合';
});

copyBtn.addEventListener('click', () => {
  if (!outputText.value) return;
  navigator.clipboard.writeText(outputText.value).then(() => {
    copyBtn.classList.add('copied');
    copyLabel.textContent = '已複製';
    setTimeout(() => {
      copyBtn.classList.remove('copied');
      copyLabel.textContent = '複製';
    }, 2000);
  });
});

regexInput.addEventListener('input', getRegex);
</script>
</body>
</html>
